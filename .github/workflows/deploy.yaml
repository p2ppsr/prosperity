name: Verify and deploy Babbage OS

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: babbage-os-cars-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run build

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARS_REQUEST_TIMEOUT_MS: "300000"
      VITE_RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify CARS identity and project balance
        env:
          CARS_PRIVATE_KEY: ${{ secrets.CARS_PRIVATE_KEY }}
          CARS_WALLET_STORAGE: ${{ secrets.CARS_WALLET_STORAGE }}
        run: |
          set -euo pipefail
          test -n "${CARS_PRIVATE_KEY:-}" || { echo "CARS_PRIVATE_KEY is required" >&2; exit 1; }
          storage_args=()
          if [ -n "${CARS_WALLET_STORAGE:-}" ]; then storage_args=(--storage "$CARS_WALLET_STORAGE"); fi
          npx cars doctor Babbage --key "$CARS_PRIVATE_KEY" --network mainnet "${storage_args[@]}"
          npx cars project ensure-balance Babbage --key "$CARS_PRIVATE_KEY" --network mainnet "${storage_args[@]}" --min 1 --topup-to 235000
      - name: Release to CARS
        env:
          CARS_PRIVATE_KEY: ${{ secrets.CARS_PRIVATE_KEY }}
          CARS_WALLET_STORAGE: ${{ secrets.CARS_WALLET_STORAGE }}
        run: |
          set -euo pipefail
          storage_args=()
          if [ -n "${CARS_WALLET_STORAGE:-}" ]; then storage_args=(--storage "$CARS_WALLET_STORAGE"); fi
          npx cars release now Babbage --key "$CARS_PRIVATE_KEY" --network mainnet "${storage_args[@]}" 2>&1 | tee cars-release.log
          grep -q "CARS_RELEASE_SUCCESS" cars-release.log
